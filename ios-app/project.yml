name: ChanganRemote
options:
  bundleIdPrefix: az.c589
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "2.2.4"
    CURRENT_PROJECT_VERSION: "20261116"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ChanganRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChanganRemote
    info:
      path: ChanganRemote/Info.plist
      properties:
        CFBundleDisplayName: "Changan Remote"
        CFBundleShortVersionString: "2.2.4"
        CFBundleVersion: "20261116"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        NSCameraUsageDescription: "Avtomobilin QR kodunu skan etmək üçün kamera icazəsi lazımdır."
        NSMicrophoneUsageDescription: "Xarici meqafon funksiyası üçün mikrofon icazəsi lazımdır."
        NSPhotoLibraryAddUsageDescription: "Avtomobil kamerasından çəkilmiş şəkilləri Qalereyaya saxlamaq üçün icazə lazımdır."
        NSBluetoothAlwaysUsageDescription: "Avtomobilə yaxın məsafədən birbaşa Bluetooth (BLE) ilə qoşulmaq üçün icazə tələb olunur."
        NSLocalNetworkUsageDescription: "Avtomobilin agentinə qoşulmaq üçün şəbəkə icazəsi tələb olunur."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.c589.changanremote.ios
        PRODUCT_NAME: ChanganRemote
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
